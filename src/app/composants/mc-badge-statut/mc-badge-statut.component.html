@if (statut(); as s) {
  <span
    class="mc-badge-statut"
    [style.color]="s.couleur"
    [style.background]="s.fond"
    [attr.title]="s.libelle"
    [attr.aria-label]="s.libelle"
    >{{ s.glyphe }}</span
  >
} @else {
  <span class="mc-badge-statut mc-badge-statut--vide" aria-hidden="true">—</span>
}
