@if (pastilles().length > 0) {
  <fieldset
    class="mc-pastilles-eleves-concernes mc-groupe-nu"
    [attr.aria-label]="LIBELLES.elevesConcernes.ariaListePastilles"
  >
    @for (pastille of pastilles(); track pastille.id) {
      <span class="mc-disc-pill">{{ pastille.libelle }}</span>
    }
  </fieldset>
}
