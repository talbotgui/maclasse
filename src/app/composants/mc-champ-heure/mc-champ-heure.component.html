<div class="mc-champ">
  <label [for]="id()">
    {{ label() }}
    @if (required()) {
      <span class="mc-champ-requis" aria-hidden="true"> *</span>
    }
  </label>
  <input
    type="time"
    [id]="id()"
    [required]="required()"
    [attr.aria-describedby]="descriptionIds()"
    [disabled]="estDesactive()"
    [value]="valeur()"
    (input)="surChangement($any($event.target).value)"
    (blur)="surBlur()"
  />
</div>
