<div class="mc-arbre-competences">
  <mc-champ-recherche
    id="rechercheArbreCompetences"
    [placeholder]="LIBELLES.commun.rechercher"
    (rechercheChange)="surRecherche($event)"
  />

  @if (domaines().length > 0) {
    <div
      class="mc-arbre-competences__domaines"
      role="group"
      [attr.aria-label]="LIBELLES.selecteurCompetences.ariaFiltreDomaine"
    >
      @for (domaine of domaines(); track domaine.id) {
        <mc-chip-filtre
          [id]="'filtreDomaine_' + domaine.id"
          [libelle]="domaine.libelle"
          [actif]="estDomaineActif(domaine.id)"
          (selectionChange)="basculerDomaine(domaine.id)"
        />
      }
    </div>
  }

  <div
    class="mc-arbre-competences__arbre"
    role="tree"
    [attr.aria-label]="LIBELLES.competences.ariaArbreCompetences"
  >
    @if (noeudsAffiches().length === 0) {
      <p class="mc-liste-vide">{{ LIBELLES.commun.aucunResultat }}</p>
    }
    @for (noeud of noeudsAffiches(); track noeud.competence.id; let i = $index) {
      <div class="mc-arbre-competences__noeud" [style.padding-left.rem]="noeud.niveau * 1.25">
        @if (!noeud.estFeuille) {
          <button
            [id]="'noeudToggle_' + noeud.competence.id"
            type="button"
            tabindex="-1"
            class="mc-arbre-competences__toggle"
            [attr.aria-label]="
              (noeud.estDeplie
                ? LIBELLES.competences.ariaReplierNoeud
                : LIBELLES.competences.ariaDeplierNoeud) + noeud.competence.libelle
            "
            (click)="basculerNoeud(noeud.competence.id)"
          >
            {{ noeud.estDeplie ? '▼' : '▶' }}
          </button>
        } @else {
          <span class="mc-arbre-competences__indent"></span>
        }
        <button
          #boutonSelection
          [id]="'noeudSel_' + noeud.competence.id"
          type="button"
          role="treeitem"
          [attr.tabindex]="i === indexFocalise() ? 0 : -1"
          [attr.aria-expanded]="noeud.estFeuille ? null : noeud.estDeplie"
          [attr.aria-selected]="noeud.estSelectionne"
          class="mc-arbre-competences__libelle"
          [class.mc-arbre-competences__libelle--dans-panier]="noeud.estSelectionne"
          (keydown)="naviguerClavier($event, i)"
          (focus)="surFocusNoeud(i)"
        >
          {{ noeud.competence.libelle }}
        </button>
        <button
          [id]="'btnAjouterPanier_' + noeud.competence.id"
          type="button"
          tabindex="-1"
          class="mc-arbre-competences__ajouter mc-btn-icone mc-btn-xs"
          [attr.aria-label]="LIBELLES.competences.ariaAjouterAuPanier + noeud.competence.libelle"
          [disabled]="noeud.estSelectionne"
          (click)="ajouterAuPanier(noeud.competence.id)"
        >
          +
        </button>
      </div>
    }
  </div>
</div>
