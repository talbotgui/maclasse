<div class="mc-champ">
  <label [for]="id()">
    {{ label() }}
    @if (required()) {
      <span class="mc-champ-requis" aria-hidden="true"> *</span>
    }
  </label>
  <input
    [id]="id()+'-input'"
    [type]="type()"
    [placeholder]="placeholder()"
    [required]="required()"
    [disabled]="estDesactive()"
    [value]="valeur()"
    (input)="surChangement($any($event.target).value)"
    (blur)="surBlur()"
  />
</div>
